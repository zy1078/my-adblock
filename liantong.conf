^https?:\/\/m\.client\.10010\.com\/uniAdmsInterface\/getWelcomeAd - reject-200

# 首页瀑布流推广
^https?:\/\/img\.client\.10010\.com\/homejingxuan12\/js\/(pubuliu|1homeView) - reject

[Script]
# 首页浮窗
联通首页浮窗 = type=http-response, pattern=^https?:\/\/m\.client\.10010\.com\/clientIndex\/homefusion\/fuInter, script-path=https://raw.githubusercontent.com/zy1078/my-adblock/main/liantong-own.js?v=2, requires-body=true

# 我的页面借钱入口
联通借钱入口 = type=http-response, pattern=^https?:\/\/m\.client\.10010\.com\/clientMyPage\/v\d\/api\/myWallet, script-path=https://raw.githubusercontent.com/zy1078/my-adblock/main/liantong-own.js?v=2, requires-body=true

[MITM]
hostname = %APPEND% m.client.10010.com, img.client.10010.com
